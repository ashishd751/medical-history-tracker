# Dev-only flow: runs every library spike on-device so results can be read back.
# Proves the native modules actually link and execute; not part of the shipped suite.
appId: com.ashishd751.medicalhistory
---
- tapOn: 'Run library spikes'
- assertVisible: 'Library spikes'
- tapOn: 'Run all checks'
- extendedWaitUntil:
    visible: 'react-native-zip-archive'
    timeout: 120000
